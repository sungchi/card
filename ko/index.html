      @keyframes sj-boot-blink {

        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sj-boot__label {

  <body>
    <div id="root">
      <div class="sj-boot" role="status" aria-live="polite" aria-busy="true">
        <p class="sj-boot__title"><span id="sj-boot-name">카드 배틀</span></p>
        <p class="sj-boot__label"><span id="sj-boot-text">불러오는 중</span><span aria-hidden="true">···</span></p>
      </div>
    </div>
    <script>
      // Boot line in the player's language (explicit entry, stored choice, then browser) and the
      // viewport class before the first paint (src/lib/viewport.ts keeps it up to date).
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('sj:lang'); } catch (e) {}
        try {
          var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase().split(/[-_]/)[0];
          var entry = document.documentElement.getAttribute('data-entry-lang');
          var lang = entry === 'ko' || entry === 'ja' || entry === 'en' ? entry : stored === 'ko' || stored === 'ja' || stored === 'en' ? stored : nav === 'ko' || nav === 'ja' ? nav : 'en';
          document.documentElement.lang = lang;
          document.getElementById('sj-boot-name').textContent = lang === 'ko' ? '카드 배틀' : 'Card Battle';
          document.getElementById('sj-boot-text').textContent = lang === 'ko' ? '불러오는 중' : lang === 'ja' ? '読み込み中' : 'Loading';
          var w = window.innerWidth;
          var q = new URLSearchParams(location.search).get('view');
          document.documentElement.setAttribute('data-view', q === 'mobile' ? 'mobile' : q === 'desktop' ? (w >= 1440 ? 'wide' : 'desktop') : w < 640 ? 'mobile' : w < 1024 ? 'tablet' : w < 1440 ? 'desktop' : 'wide');
          if (localStorage.getItem('sj:motion') === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
        } catch (e) {}
      })();
    </script>
    <noscript>
      <p style="padding: 16px; text-align: center; font-family: sans-serif">카드 배틀은 JavaScript가 필요하다. / Card Battle needs JavaScript.</p>
    </noscript>
