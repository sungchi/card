<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- No user-scalable=no: zoom must stay available (UI-52). viewport-fit=cover for the safe-area insets (UI-42). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/card/assets/favicon/card-battle-v1.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/card/assets/favicon/card-battle-v1-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/card/assets/favicon/card-battle-v1-180.png" sizes="180x180" />
    <title>카드 배틀 · 30자 카드 결투</title>
    <meta name="description" content="30자 설명으로 카드를 만들면 판정관이 유형을 읽는다. 세 장의 설명과 순서로 겨루는 비동기 3:3 카드 결투." />
    <!-- Pretendard for the white UI; Jua and Noto remain the card fonts. All fonts are self-hosted OFL subsets. -->
    <link rel="stylesheet" href="/card/fonts/pretendard/pretendardvariable-dynamic-subset.css" />
    <link rel="stylesheet" href="/card/fonts/jua/jua.css" />
    <link rel="stylesheet" href="/card/fonts/noto-sans-kr/noto-sans-kr.css" />
    <style>
      /* Boot splash before the bundle loads (replaced by React): the name in the UI font over a blinking line. */
      html,
      body {
        margin: 0;
        background: #ffffff;
        color: #111111;
      }
      .sj-boot {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        box-sizing: border-box;
        font-family: 'Pretendard Variable', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
        text-align: center;
      }
      .sj-boot__title {
        margin: 0;
        font-family: 'Pretendard Variable', 'Noto Sans KR', sans-serif;
        font-size: 40px;
        font-weight: 800;
        line-height: 1.1;
      }
      .sj-boot__label {
        margin: 0;
        color: #6f6f6f;
        font-size: 16px;
        animation: sj-boot-blink 900ms ease-in-out infinite;
      }
      @keyframes sj-boot-blink {
        0%,
        100% {
          opacity: 0.25;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sj-boot__label {
          animation: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/card/assets/index-Bg5YVuuX.js"></script>
    <link rel="stylesheet" crossorigin href="/card/assets/index-DXfIi_CR.css">
  </head>
  <body>
    <div id="root">
      <div class="sj-boot" role="status" aria-live="polite" aria-busy="true">
        <p class="sj-boot__title"><span id="sj-boot-name">카드 배틀</span></p>
        <p class="sj-boot__label"><span id="sj-boot-text">불러오는 중</span><span aria-hidden="true">···</span></p>
      </div>
    </div>
    <script>
      // Boot line in the player's language (same rule as the app: stored choice, else the browser) and the
      // viewport class before the first paint (src/lib/viewport.ts keeps it up to date).
      (function () {
        try {
          var stored = localStorage.getItem('sj:lang');
          var nav = (navigator.language || '').toLowerCase();
          var ko = stored === 'ko' || (stored !== 'en' && nav.indexOf('ko') === 0);
          if (!ko) {
            document.documentElement.lang = 'en';
            document.getElementById('sj-boot-name').textContent = 'Card Battle';
            document.getElementById('sj-boot-text').textContent = 'Loading';
          }
          var w = window.innerWidth;
          var q = new URLSearchParams(location.search).get('view');
          document.documentElement.setAttribute('data-view', q === 'mobile' ? 'mobile' : q === 'desktop' ? (w >= 1440 ? 'wide' : 'desktop') : w < 640 ? 'mobile' : w < 1024 ? 'tablet' : w < 1440 ? 'desktop' : 'wide');
          if (localStorage.getItem('sj:motion') === 'reduced') document.documentElement.setAttribute('data-motion', 'reduced');
        } catch (e) {}
      })();
    </script>
    <noscript>
      <p style="padding: 16px; text-align: center; font-family: sans-serif">카드 배틀은 JavaScript가 필요하다. / Card Battle needs JavaScript.</p>
    </noscript>
  </body>
</html>
